<!Doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page-content" style="margin: 30px">
      <div class="links" style="margin-left: -50px; margin-bottom: -10vh;">
        <a href="index.html" class="sublinks" style="margin-bottom: 40px;">Google</a>
      </div>

      <p style="font-family: sans-serif; font-size: 30px; font-style: bold; margin: 10px;">
        Advanced Search
      </p>
      <p style="font-family: sans-serif; font-size: 20px; padding: 20px; padding-bottom: 0px; margin: 0px;">
        Find pages with
      </p>

      <form action="https://www.google.com/search" method="GET">
        <div class="advanced-search">
          <div class="advanced-search-div">
            <p class="advanced-search-text">All of these words:</p>
            <input type="text" name="as_q" class="advanced-search-bar">
          </div>

          <div class="advanced-search-div">
            <p class="advanced-search-text">This exact word or phrase:</p>
            <input type="text" name="as_epq" class="advanced-search-bar">
          </div>

          <div class="advanced-search-div">
            <p class="advanced-search-text">Any of these words:</p>
            <input type="text" name="as_oq" class="advanced-search-bar">
          </div>

          <div class="advanced-search-div">
            <p class="advanced-search-text">None of these words:</p>
            <input type="text" name="as_eq" class="advanced-search-bar">
          </div>
        </div>
        <input type="submit" value="Advanced Search" style="
          padding: 10px;
          background-color: blue;
          color: white;
          border-radius: 20px;
          border-width: 0px;
          margin: 10px;
          margin-left: 10vw;
        ">
      </form>
    </div>
  </body>
</html>
